name: Update Google Scholar Citations

on:
  schedule:
    # Run every hour on the hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update citation metrics
        run: |
          python3 scripts/update_scholar_citations.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/portfolio_data.json data/portfolio_data.js index.html README.md
            git commit -m "Auto-update Google Scholar citation metrics [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes detected. Repository is up to date."
          fi
